# Local environment: API + PostgreSQL.
# Copy .env.example to .env and fill in the secrets first (.env is git-ignored).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stocktrack
      POSTGRES_USER: stocktrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocktrack -d stocktrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=stocktrack;Username=stocktrack;Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Database__MigrateOnStartup: "true"
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@stocktrack.local}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}

volumes:
  pgdata:
